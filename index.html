<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Script Analyzer</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
  textarea { width: 100%; height: 200px; font-family: monospace; margin-bottom: 10px; }
  input, button { margin-top: 10px; }
  .result { margin-top: 20px; padding: 10px; border-radius: 5px; }
  .ai { background-color: #ffe0e0; color: #a00; }
  .human { background-color: #e0ffe0; color: #0a0; }
</style>
</head>
<body>

<h1>Lua Script Analyzer</h1>

<label for="luaCode">Paste Lua script here:</label>
<textarea id="luaCode" placeholder="-- Your Lua script"></textarea>

<br>
<input type="file" id="fileInput" accept=".lua">
<br>
<button onclick="analyzeLua()">Analyze Script</button>

<div class="result" id="result"></div>

<script>
// Helper: read uploaded file
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('luaCode').value = e.target.result;
    }
    reader.readAsText(file);
});

// Heuristic analyzer
function analyzeLua() {
    const code = document.getElementById('luaCode').value;
    if (!code.trim()) {
        alert('Please paste or upload a Lua script.');
        return;
    }

    let aiScore = 0;
    let humanScore = 0;

    // Heuristics for AI-generated scripts
    const lines = code.split('\n');
    const totalLines = lines.length;

    let commentCount = 0;
    let shortVarCount = 0;
    let longVarCount = 0;
    let repetitivePatterns = 0;

    const varRegex = /\b[a-zA-Z_][a-zA-Z0-9_]*\b/g;

    lines.forEach(line => {
        const trimmed = line.trim();

        // Count comments
        if (trimmed.startsWith('--')) commentCount++;

        // Check for very generic variable names
        const vars = trimmed.match(varRegex);
        if (vars) {
            vars.forEach(v => {
                if (v.length <= 2) shortVarCount++;
                if (v.length >= 10) longVarCount++;
            });
        }

        // Repetitive patterns typical of AI
        if (/-- /.test(trimmed) && trimmed.length > 50) repetitivePatterns++;
    });

    // Scoring
    if (commentCount / totalLines > 0.3) aiScore++; // too many comments
    if (shortVarCount / totalLines > 0.1) aiScore++; // very short variables
    if (longVarCount / totalLines > 0.05) aiScore++; // very long variables
    if (repetitivePatterns / totalLines > 0.1) aiScore++; // verbose AI-style comments

    // Human indicators
    if (commentCount / totalLines < 0.2) humanScore++;
    if (shortVarCount / totalLines < 0.05) humanScore++;

    // Result
    const resultDiv = document.getElementById('result');
    if (aiScore > humanScore) {
        resultDiv.textContent = `⚠️ Likely AI-generated script (score: AI ${aiScore} vs Human ${humanScore})`;
        resultDiv.className = 'result ai';
    } else {
        resultDiv.textContent = `✅ Likely human-written script (score: AI ${aiScore} vs Human ${humanScore})`;
        resultDiv.className = 'result human';
    }
}
</script>

</body>
</html>
